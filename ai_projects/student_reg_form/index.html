<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f5f7fa;
    padding:40px;
}

.container{
    max-width:1200px;
    margin:auto;
    background:white;
    padding:40px;
    border-radius:10px;
    box-shadow:0 0 15px rgba(0,0,0,0.1);
}

h1{
    text-align:center;
    margin-bottom:40px;
    font-size:48px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.form-group{
    display:flex;
    flex-direction:column;
}

input{
    width:100%;
    padding:15px;
    border:1px solid #dcdcdc;
    border-radius:8px;
    font-size:18px;
}

.error{
    color:red;
    font-size:14px;
    margin-top:5px;
}

.save-btn{
    width:100%;
    margin-top:20px;
    padding:15px;
    border:none;
    border-radius:8px;
    background:#0d6efd;
    color:white;
    font-size:18px;
    cursor:pointer;
}

.save-btn:hover{
    background:#0b5ed7;
}

table{
    width:100%;
    margin-top:40px;
    border-collapse:collapse;
}

th{
    background:#0d6efd;
    color:white;
    padding:15px;
}

td{
    padding:15px;
    border:1px solid #ddd;
    text-align:center;
}

.edit-btn{
    background:#0d6efd;
    color:white;
    border:none;
    padding:8px 15px;
    border-radius:5px;
    cursor:pointer;
}

.delete-btn{
    background:#dc3545;
    color:white;
    border:none;
    padding:8px 15px;
    border-radius:5px;
    cursor:pointer;
}

.edit-btn:hover{
    background:#0b5ed7;
}

.delete-btn:hover{
    background:#bb2d3b;
}

</style>
</head>
<body>

<div class="container">

    <h1>Student Registration</h1>

    <div class="form-grid">

        <div class="form-group">
            <input type="text" id="name" placeholder="Name">
            <small class="error" id="nameError"></small>
        </div>

        <div class="form-group">
            <input type="number" id="age" placeholder="Age">
            <small class="error" id="ageError"></small>
        </div>

        <div class="form-group">
            <input type="text" id="course" placeholder="Course">
            <small class="error" id="courseError"></small>
        </div>

        <div class="form-group">
            <input type="email" id="email" placeholder="Email">
            <small class="error" id="emailError"></small>
        </div>

    </div>

    <button class="save-btn" onclick="saveStudent()">
        Save Student
    </button>

    <table>

        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Age</th>
                <th>Course</th>
                <th>Email</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody id="studentTableBody"></tbody>

    </table>

</div>

<script>

let students = [];
let editIndex = -1;
let nextId = 1;

function clearErrors(){

    document.getElementById("nameError").textContent = "";
    document.getElementById("ageError").textContent = "";
    document.getElementById("courseError").textContent = "";
    document.getElementById("emailError").textContent = "";
}

function saveStudent(){

    clearErrors();

    let name = document.getElementById("name").value.trim();
    let age = Number(document.getElementById("age").value);
    let course = document.getElementById("course").value.trim();
    let email = document.getElementById("email").value.trim();

    let isValid = true;

    const namePattern = /^[A-Za-z ]{3,}$/;
    const coursePattern = /^[A-Za-z ]{2,}$/;
    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    /* Name Validation */

    if(name === ""){
        document.getElementById("nameError").textContent =
        "Name is required";
        isValid = false;
    }
    else if(!namePattern.test(name)){
        document.getElementById("nameError").textContent =
        "Only letters and spaces (minimum 3 characters)";
        isValid = false;
    }

    /* Age Validation */

    if(isNaN(age)){
        document.getElementById("ageError").textContent =
        "Age is required";
        isValid = false;
    }
    else if(age < 15 || age > 100){
        document.getElementById("ageError").textContent =
        "Age must be between 15 and 100";
        isValid = false;
    }

    /* Course Validation */

    if(course === ""){
        document.getElementById("courseError").textContent =
        "Course is required";
        isValid = false;
    }
    else if(!coursePattern.test(course)){
        document.getElementById("courseError").textContent =
        "Only letters and spaces (minimum 2 characters)";
        isValid = false;
    }

    /* Email Validation */

    if(email === ""){
        document.getElementById("emailError").textContent =
        "Email is required";
        isValid = false;
    }
    else if(!emailPattern.test(email)){
        document.getElementById("emailError").textContent =
        "Please enter a valid email";
        isValid = false;
    }

    if(!isValid){
        return;
    }

    if(editIndex === -1){

        students.push({
            id: nextId++,
            name:name,
            age:age,
            course:course,
            email:email
        });

    }else{

        students[editIndex].name = name;
        students[editIndex].age = age;
        students[editIndex].course = course;
        students[editIndex].email = email;

        editIndex = -1;
    }

    displayStudents();
    clearForm();
}

function displayStudents(){

    let tableBody =
    document.getElementById("studentTableBody");

    tableBody.innerHTML = "";

    students.forEach((student,index)=>{

        tableBody.innerHTML += `
        <tr>
            <td>${student.id}</td>
            <td>${student.name}</td>
            <td>${student.age}</td>
            <td>${student.course}</td>
            <td>${student.email}</td>
            <td>
                <button
                    class="edit-btn"
                    onclick="editStudent(${index})">
                    Edit
                </button>

                <button
                    class="delete-btn"
                    onclick="deleteStudent(${index})">
                    Delete
                </button>
            </td>
        </tr>
        `;
    });
}

function editStudent(index){

    document.getElementById("name").value =
    students[index].name;

    document.getElementById("age").value =
    students[index].age;

    document.getElementById("course").value =
    students[index].course;

    document.getElementById("email").value =
    students[index].email;

    editIndex = index;
}

function deleteStudent(index){

    if(confirm("Delete this student?")){

        students.splice(index,1);

        displayStudents();
    }
}

function clearForm(){

    document.getElementById("name").value = "";
    document.getElementById("age").value = "";
    document.getElementById("course").value = "";
    document.getElementById("email").value = "";
}

</script>

</body>
</html>
